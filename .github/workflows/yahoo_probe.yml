name: Yahoo bar probe (temporary)
# 2026-10-17: the evening refresh misses the same-day close on some days with every
# ticker and index missing together (10 hits, 14 misses since 09-11). Poll Yahoo from a
# runner each weekday evening to see when the day's bar appears, whether the URL form or
# the backend cluster matters, and whether meta is current when the bar is missing.
# Writes nothing. Not in the daily-refresh concurrency group on purpose (it would block
# price updates for hours). Delete once answered.
on:
  schedule:
    - cron: "47 20 * * 1-5"   # 16:47 ET (EDT) nominal; GitHub starts it 2-5 h late here
  workflow_dispatch:
    inputs:
      rounds: {description: "polls", default: "16"}
      gap: {description: "seconds between poll starts", default: "1200"}
permissions:
  contents: read
defaults:
  run:
    shell: bash   # pipefail, so a crash under `| tee` fails the step
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - timeout-minutes: 325   # leaves the upload room inside the job limit
        run: python3 pipeline/probe_yahoo_bar.py "${{ inputs.rounds || '16' }}" "${{ inputs.gap || '1200' }}" 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: yahoo-probe, path: probe.log}
