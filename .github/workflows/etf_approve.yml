name: ETF approve verdict code

# 카드 판정 코드 해시 승인 — 사람이 이슈(라벨 etf-alert, "[ETF SPY code_sig]")의 diff를 보고 한 번 실행한다(2026-10-20 사용자 결정).
# 일부러 concurrency 그룹에 넣지 않는다: 같은 그룹이면 대기 중에 뒤에 온 실행에 밀려 조용히 취소될 수 있다(설계 dr r3, Fable).
# 쓰는 파일(v2/etf/ticker_alias.json·approved_src/)은 다른 워크플로가 쓰지 않는다. 승인 커밋 뒤 ETF 워크플로를 다시 부른다
# (그쪽이 밀려도 다음 실행이 다시 평가 — 무해). 적용 여부의 기준은 main의 승인 커밋(ticker_alias.json)이다 —
# 이슈 댓글은 알림일 뿐이라 댓글 API가 실패하면 빠질 수 있다.

on:
  workflow_dispatch:
    inputs:
      hashes:
        description: "승인할 해시(12자, 쉼표로 여러 개)"
        required: true
      note:
        description: "메모(무엇이 바뀌었는지)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: write   # ETF 워크플로 다시 부르기

defaults:
  run:
    shell: bash

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Approve and commit
        id: approve
        env:
          HASHES: ${{ inputs.hashes }}
          NOTE: ${{ inputs.note }}
        run: |
          HASHES="${HASHES// /}"
          [[ "$HASHES" =~ ^[0-9a-f]{12}(,[0-9a-f]{12})*$ ]] || { echo "해시 형식이 아니다: $HASHES"; exit 2; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # push가 거절되면 받아서 스크립트를 다시 돌린다(같은 해시를 다시 승인해도 무해)
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 v2/etf/etf_approve.py --hashes "$HASHES" --note "$NOTE"
            echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"
            git add v2/etf/ticker_alias.json v2/etf/approved_src
            if git diff --cached --quiet; then echo "already=true" >> "$GITHUB_OUTPUT"; echo "새로 바뀐 것 없음(이미 승인됨)"; exit 0; fi
            git commit -q -m "ETF: approve verdict code ${HASHES}"
            if git push; then echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((i * 15))
          done
          echo "push 실패"; exit 1

      - name: Re-run ETF and index cards
        id: rerun
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run etf_index.yml --ref main

      # 승인 커밋이 올라갔으면 다시 부르기 성공 여부와 상관없이 댓글(둘을 나눠 적는다)
      - name: Comment on the open code_sig issue
        if: always() && steps.approve.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.approve.outputs.sha }}
          HASHES: ${{ steps.approve.outputs.hashes }}
          RERUN: ${{ steps.rerun.outcome }}
          ALREADY: ${{ steps.approve.outputs.already }}
        run: |
          if [ "$RERUN" = success ]; then again="ETF 워크플로를 다시 불렀다"; else again="ETF 워크플로 다시 부르기 실패 — 다음 예약 실행이 평가한다"; fi
          n=$(gh issue list --label etf-alert --state open --json number,title -q '.[] | select(.title | startswith("[ETF SPY code_sig]")) | .number' | head -1)
          if [ "$ALREADY" = true ]; then head="해시 ${HASHES}는 이미 main에 승인돼 있다(새 커밋 없음)"; else head="승인 적용 커밋 ${SHA} (해시 ${HASHES})"; fi
          if [ -n "$n" ]; then gh issue comment "$n" --body "${head}. ${again}. 문제없음이 확인되면 이 이슈는 자동으로 닫힌다."; fi
