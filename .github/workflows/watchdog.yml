name: Watchdog

# 예약 실행이 빠졌는지 하루 세 번 본다(2026-10-08). GitHub는 바쁠 때 예약 실행을 건너뛰고 아무 알림도 남기지 않는다
# (2026-09-21 아침 재시도, 2026-10-08 13:00 재시도). 밀린 게 있으면 그 작업을 다시 시작하고, 이 실행을 실패로 끝내 메일이 가게 한다.
# 시각: 03:29 UTC(저녁 가격·v2 뒤), 15:29 UTC(아침 재시도 뒤 = 11:29 ET), 19:29 UTC(토요일 실행 뒤). 정각을 비킨다 — 정각은 GitHub가 가장 많이 밀린다.
# 감시 자체도 예약이라 빠질 수 있다 — 그래서 하루 세 번 둔다.

on:
  schedule:
    - cron: "29 3,15,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write   # 밀린 작업 다시 시작(gh workflow run)

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check
        id: check
        run: |
          python3 pipeline/watchdog.py | tee watch.log
          echo "json=$(tail -1 watch.log)" >> "$GITHUB_OUTPUT"

      - name: Restart what is behind
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.check.outputs.json }}
        run: |
          flag() { python3 -c "import json,os; print(str(json.loads(os.environ['OUT'])['$1']).lower())"; }
          # 돌고 있거나 대기 중이면 기다린다(알림 없음). 감시가 24시간 안에 이미 다시 시작했으면 또 시작하지 않고 알리기만 한다 —
          # 같은 실패를 하루 세 번 되풀이하지 않게(Codex 2026-10-08).
          active() { gh run list --workflow "$1" --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length'; }
          redispatched() {
            gh run list --workflow "$1" --event workflow_dispatch --limit 10 --json createdAt \
              --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 86400))] | length'
          }
          wf=""; args=""; what=""
          if [ "$(flag price)" = "true" ]; then wf=daily_refresh.yml; what="가격"
          elif [ "$(flag weekly)" = "true" ]; then wf=v2_cards.yml; args="-f mode=weekly"; what="토요일 v2"
          elif [ "$(flag v2)" = "true" ]; then wf=v2_cards.yml; args="-f mode=daily"; what="v2 카드"; fi
          [ -z "$wf" ] && exit 0
          if [ "$(active $wf)" != "0" ]; then echo "$what 실행 중 — 기다린다"; exit 0; fi
          if [ "$(redispatched $wf)" = "0" ]; then
            gh workflow run $wf $args
            echo "::error::$what 밀림 — 다시 시작했다"
          else
            echo "::error::$what 밀림 — 24시간 안에 이미 다시 시작했는데도 그대로다. 확인이 필요하다"
          fi
          exit 1   # 실패로 끝내 메일이 가게 한다
