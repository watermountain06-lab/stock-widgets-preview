name: Site UI data

# 홈·Tracking·뉴스·영상 화면이 읽는 데이터 파일을 다시 만든다(2026-10-17, 라이브 디자인을 preview에 적용).
# 화면(index.html·today.html·market-news.html과 CSS·JS)은 라이브 저장소 것을 옮겨 왔고, 데이터는
# pipeline/site_ui/의 스크립트(라이브 scripts/의 build_home·build_value_gap·build_stock_news·build_tracking을
# preview 경로로 옮긴 것)가 preview 카드 118장 전부로 만든다.
#   - 가격·카드 작업(Daily data refresh, v2 cards rebuild)이 끝나면 이어서 돈다. build_tracking이 원격의
#     v2/daily_status.json 이력을 읽으므로 그 작업들이 push한 뒤에 돌아야 그날 세션이 들어간다.
#   - 시장 뉴스(Google News RSS)는 라이브와 같은 매일 12:00 UTC에 받는다.
#   - Portfolio 탭 전략 비교의 일별 고정 기록(site_data/strategy_ledger/, 2026-10-19 — pipeline/portfolio/STRATEGY_DESIGN.md)도
#     여기서 쓴다. 그날 판정(v2 cards)이 끝난 뒤 한 번만 쓰고, 이미 있는 날짜 파일은 절대 바꾸지 않는다.
# 이 작업이 커밋하는 것은 아래 다섯 파일과 strategy_ledger/뿐이다.

on:
  workflow_run:
    workflows: ["Daily data refresh", "v2 cards rebuild"]
    types: [completed]
  schedule:
    - cron: "0 12 * * *"   # 시장 뉴스: 미국 동부 08:00, 한국 21:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-ui
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # build_tracking·build_value_gap이 v2/daily_status.json의 git 이력을 읽는다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Market news
        if: github.event_name != 'workflow_run'
        run: python3 pipeline/site_ui/refresh_market_news.py

      - name: Build
        run: |
          python3 pipeline/site_ui/build_stock_data.py
          python3 pipeline/site_ui/build_value_gap.py
          python3 pipeline/site_ui/build_stock_news.py
          python3 pipeline/site_ui/build_tracking.py

      - name: Strategy ledger (Portfolio tab, preview only)
        env:
          GH_TOKEN: ${{ github.token }}   # 직전 기록의 push 시각(공개 시각)을 GitHub 활동 기록에서 읽는다
        run: |
          python3 pipeline/site_ui/test_strategy_ledger.py
          python3 pipeline/site_ui/build_strategy_ledger.py
          # 이미 있던 날짜 파일이 바뀌거나 지워지면 실패한다(index.json만 예외)
          if git status --porcelain -- site_data/strategy_ledger | grep -v 'index.json' | grep -v '^??'; then
            echo "strategy_ledger: an existing record changed"; exit 1; fi

      - name: Commit
        id: commit
        run: |
          git add stock-data.js value-data.js stock-news.js tracking-data.js market-news-snapshot.json site_data/strategy_ledger
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site UI data $(date -u +%Y-%m-%d)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase && git push; then pushed=true; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 20))
          done
          git fetch -q origin main
          if [ "$pushed" != true ] || [ -n "$(git rev-list origin/main..HEAD)" ]; then echo "push 실패"; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Actions 토큰으로 한 push는 Pages 빌드를 띄우지 않을 수 있어 직접 요청한다(v2_cards.yml과 같은 방식)
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
