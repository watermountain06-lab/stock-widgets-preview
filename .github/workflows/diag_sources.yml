name: Diagnose data source reachability (temporary)

# Manual-only probe: which macro data endpoints answer from a GitHub runner?
# FRED's public CSV timed out 3x60s from here on 2026-09-11 while answering
# instantly from a local machine. Delete this file once a source is chosen.

on: workflow_dispatch

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe candidate endpoints (same browser User-Agent as the pipeline)
        run: |
          probe() {
            printf '%-58s ' "$1"
            curl -sS -A "Mozilla/5.0" -o /dev/null -w '%{http_code} in %{time_total}s\n' --max-time 45 "$2" \
              || echo "FAILED (timeout or connection error)"
          }
          probe "FRED public CSV (current source)" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFEDTARU"
          probe "FRED official API, no key (400 = reachable)" "https://api.stlouisfed.org/fred/series/observations?series_id=DFEDTARU&file_type=json"
          probe "NY Fed Markets API (EFFR, target range)" "https://markets.newyorkfed.org/api/rates/unsecured/effr/last/1.json"
          probe "BLS public API v1 (unemployment LNS14000000)" "https://api.bls.gov/publicAPI/v1/timeseries/data/LNS14000000"
