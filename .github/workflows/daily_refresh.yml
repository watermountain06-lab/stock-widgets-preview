name: Daily data refresh

# Refreshes prices and macro indicators after each US market close and
# commits the result straight to this repo's main (GitHub Pages serves main).
# Runs on GitHub's servers, so it doesn't depend on any local machine.
# The real domain (stock-widgets-redesign) is never touched here - promoting
# data there stays a manual, approved step.

on:
  schedule:
    # 22:00 UTC Mon-Fri = 18:00 New York (EDT) / 17:00 (EST) the same evening
    # as the close = 07:00 KST the next morning. Always after the 16:20 ET
    # completeness cutoff in pipeline/fetch_prices.py. GitHub may start
    # scheduled runs some minutes late.
    - cron: "17 22 * * 1-5"   # 정각을 비킨다(2026-10-08) — GitHub는 정각에 가장 많이 밀리고 건너뛴다
    # A second pass for the evenings the provider is simply late. On 2026-09-14 and
    # again on 2026-09-16 Yahoo still had no completed bar for that day's session at
    # 20:00 ET, and by the next morning it did - both times the site sat a day behind
    # until someone noticed, because one weekday of lag only warns. 09:00 UTC Tue-Sat
    # = 05:00 ET, well after the bar appears. A run that finds the session already
    # current writes nothing and commits nothing, so this is free on a normal day.
    - cron: "23 9 * * 2-6"
    # A third pass, because the second one is not guaranteed to run. On 2026-09-21
    # the evening run started 2.5h late, Yahoo still had no bar for that session, and
    # the 09:00 UTC retry never fired at all - GitHub drops scheduled runs under load
    # and does not queue them. The site sat a weekday behind until it was noticed by
    # hand, which is the one recovery path that is neither automatic nor free. 13:00
    # UTC Tue-Sat = 09:00 ET, before the open and long after the previous session's
    # 16:20 ET cutoff. Like the pass above, a run that finds the session already
    # current writes nothing, so a third chance costs nothing on a normal day.
    - cron: "41 13 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write   # commit site_data/ and index.html (repo default is read)
  pages: write      # request a Pages build explicitly (see below)

concurrency:
  group: daily-refresh
  cancel-in-progress: false
  # keep every pending run (default "single" cancels an older pending one when a newer queues) -
  # the refresh can now hold the group for up to 2 h waiting out Yahoo's blank close (2026-10-20)
  queue: max

defaults:
  run:
    shell: bash   # explicit bash turns on pipefail, so "| tee" can't hide a failure

jobs:
  refresh:
    runs-on: ubuntu-latest
    # worst case with every provider down: prices stop after 3 tickers x 3
    # attempts (~6 min), macro ~9 min (Yahoo 3 series + one FRED series at 60s),
    # cards stop the same way as prices (~6 min); a normal run takes ~3 min
    # plus up to 6 x 20 min in "Wait out Yahoo's blank close" (2026-10-20)
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          # 같은 그룹의 v2 재빌드 뒤에 기다렸다 돌 수 있다 — 그 커밋(등급·점수·홈)을 받고 시작한다(Codex 2026-10-07)
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Offline tests (guard against broken pipeline code)
        run: python3 pipeline/test_pipeline.py

      # Yahoo blanks the day's close on stocks' daily bars for a while in the evening (2026-10-19
      # probe: 20:16-21:16 ET). Waits while it is blank, up to 2 h; fetch_prices falls back to
      # meta after that. Never fails the job.
      - name: Wait out Yahoo's blank close
        timeout-minutes: 130
        continue-on-error: true
        run: python3 pipeline/wait_yahoo_close.py

      - name: Fetch prices
        run: python3 pipeline/fetch_prices.py --write | tee prices.log

      # FRED's public CSV drops connections from GitHub's runners; its official
      # API answers, so the key (a repo secret) is passed to this step only.
      # Without the secret the script falls back to the CSV and keeps the
      # previous values marked stale.
      - name: Fetch macro indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 pipeline/fetch_macro.py --write | tee macro.log

      - name: Build and validate
        run: |
          python3 pipeline/build_index.py
          python3 pipeline/validate_site_data.py | tee validate.log

      # Brings each card's price, chart, moving averages, tech score and header
      # up to the session just fetched. A card it can't update cleanly is left
      # as is and listed in site_data/card_status.json (the health check reads it).
      - name: Update cards
        run: python3 pipeline/update_cards.py --write | tee cards.log

      - name: Commit if the data changed
        id: commit
        run: |
          git add site_data/stocks.json site_data/macro.json index.html \
                  ./*_full_widget.html site_data/card_status.json site_data/tech_state
          if git diff --cached --quiet; then
            echo "No data change (e.g. a market holiday) - nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          session=$(python3 -c 'import json; print(json.load(open("site_data/stocks.json"))["priceSession"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily data refresh: session ${session}"
          # 실행 중에 사람이 새 카드를 올리면 같은 파일(index.html·stocks.json)의 다른 줄을 고쳐 rebase가 충돌한다
          # (2026-10-21: 21:34 ET MSI 카드 push, 10-21 갱신이 못 올라가 새 카드 MMM의 가격이 비고 Site UI가 멈춤).
          # 그래서 rebase하지 않는다: push가 거절되면 받은 main 위에서 홈·카드를 다시 만든다. 충돌 없이 합쳐지는 경우도
          # 사람이 넣은 새 종목은 가격이 비어 있으므로 같은 길로 보낸다(리뷰 2026-10-21). 가격은 다시 받지 않고 이 실행이
          # 받은 것을 옮긴다(carry_prices.py) - 새 종목과 사람이 가격·심볼을 고친 종목만 받는다. 매크로는 이 작업만 쓰므로
          # 받은 값을 되살린다.
          cp site_data/stocks.json "$RUNNER_TEMP/stocks.json"
          git show HEAD~1:site_data/stocks.json > "$RUNNER_TEMP/base.json"   # 이 실행이 시작한 커밋
          cp site_data/macro.json "$RUNNER_TEMP/macro.json"
          pushed=false
          for i in 1 2 3; do
            if git push; then pushed=true; break; fi
            [ "$i" = 3 ] && break
            echo "::warning::push 거절 ${i}/3 - 받은 main 위에서 다시 만든다"
            sleep $((i * 20))
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/macro.json" site_data/macro.json
            added=$(python3 pipeline/carry_prices.py carry "$RUNNER_TEMP/stocks.json" "$RUNNER_TEMP/base.json")
            { echo "--- push 거절 ${i}: 받은 main 위에서 다시 (따로 받을 종목: ${added:-없음}, 매크로는 첫 조회 값)"; } \
              | tee -a prices.log macro.log validate.log cards.log
            if [ -n "$added" ]; then
              # 사본에 받아 이 세션 값만 들인다 - 한 종목이 실패하거나 다른 세션을 줘도 세션 전체를 막거나 옮기지 않는다
              cp site_data/stocks.json "$RUNNER_TEMP/fetched.json"
              python3 pipeline/fetch_prices.py --data "$RUNNER_TEMP/fetched.json" --tickers "$added" --write 2>&1 \
                | tee -a prices.log || echo "::warning::따로 받을 종목 조회 실패: ${added}"
              python3 pipeline/carry_prices.py merge "$RUNNER_TEMP/fetched.json" "$added" | tee -a prices.log
            fi
            python3 pipeline/build_index.py
            python3 pipeline/validate_site_data.py | tee -a validate.log
            python3 pipeline/update_cards.py --write | tee -a cards.log
            git add site_data/stocks.json site_data/macro.json index.html \
                    ./*_full_widget.html site_data/card_status.json site_data/tech_state
            if git diff --cached --quiet; then pushed=true; break; fi   # 받은 main이 이미 같은 세션·같은 값을 담고 있다
            git commit -q -m "Daily data refresh: session ${session}"
          done
          # 성공 판정은 원격이 이 커밋을 담았는지로 한다(v2_cards.yml과 같은 방식)
          git fetch -q origin main
          if [ "$pushed" != true ] || [ -n "$(git rev-list origin/main..HEAD)" ]; then echo "push 실패 - 세 번 거절"; exit 1; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't start other workflow runs, and the
      # branch-based ("legacy") Pages build is one, so ask for a build directly.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Health check (fails the run, and so emails the owner, if the data is degraded)
        run: python3 pipeline/health_check.py --cards site_data/card_status.json | tee health.log

      - name: Run summary
        if: always()
        run: |
          {
            echo '```'
            cat prices.log macro.log validate.log cards.log health.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
