<!DOCTYPE html>
<html lang="ko">
<head>
<!-- 지수 카드 머리: 2026-10-20 NVDA_full_widget.html의 <head>(CSS·테마 스크립트)를 그대로 옮겼다 — 종목 카드와 디자인을 맞추기 위함.
     종목 카드 CSS가 바뀌면 같은 방법으로 다시 옮긴다(chart.js 줄만 뺀다). v2/index/index_daily.py가 이 파일 + index_card.html로 페이지를 만든다. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>

  /* HEADER (라이브 NVDA_analysis_widget.html에서 재사용) */
  .header { background: var(--bg2); border-top: 3px solid var(--brand); border-bottom: 2px solid var(--accent3); padding: 28px 32px 24px; position: relative; overflow: hidden; max-width: 1100px; margin: 0 auto; }
  .box-key { background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid var(--accent3); border-radius: 10px; padding: 12px 16px; max-width: 1100px; margin: 0 auto 16px; }
  .header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 240px; height: 240px; background: none; pointer-events: none; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .ticker-block { display: flex; align-items: center; gap: 16px; flex: 1 1 320px; min-width: 0; }
  .ticker-block > div { min-width: 0; }
  .ticker-badge { background: linear-gradient(135deg, var(--accent3), var(--accent)); color: var(--bg); font-size: 13px; font-weight: 800; padding: 5px 12px; border-radius: 6px; letter-spacing: 1px; }
  .company-name { font-size: 22px; font-weight: 700; color: var(--text); }
  .company-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .price-block { text-align: right; flex: 0 0 auto; margin-left: auto; }
  .price-main { font-size: 32px; font-weight: 800; color: var(--accent2); letter-spacing: -1px; }
  .price-change { font-size: 16px; color: var(--red); font-weight: 700; letter-spacing: 0; margin-right: 4px; }
  .header-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; margin-top: 16px; }
  .meta-item { display: flex; flex-direction: column; height: 100%; }
  .meta-item .meta-label { flex: 1 0 auto; }
  .header-meta { align-items: stretch; }
  .meta-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
  .meta-value { font-size: 14px; font-weight: 600; color: var(--text2); margin-top: 2px; }
  .meta-value.highlight { color: var(--accent2); }

  /* NAV */
  .nav { display: flex; justify-content: space-between; gap: 4px; padding: 12px 32px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; max-width: 1100px; margin: 0 auto; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn { background: none; border: none; color: var(--text3); font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.2s; letter-spacing: 0.3px; }
  .nav-btn:hover { color: var(--text); background: var(--bg3); }
  .nav-btn.active { background: var(--accent3); color: var(--accent2); }

  /* SECTIONS (tab show/hide) */
  .section { display: none; padding: 28px 32px; max-width: 1100px; margin: 0 auto; }
  .section.active { display: block; }
  /* 요약은 탭이 아니라 항상 보이는 맨 윗단이다. 나머지 탭은 탭 바 아래에서
     펼쳤다 접었다 한다. `.section`을 쓰지 않으므로 showSection이 건드리지 않는다. */
  .summary { display: block; padding: 28px 32px; max-width: 1100px; margin: 0 auto; }


/* ══════ #tech ══════ */
  :root {
    --bg: var(--bg); --bg2: var(--bg2); --bg3: var(--bg3); --border: var(--border);
    --text: var(--text); --text2: var(--text2); --text3: var(--text3);
    
    --ma5: #ff6b9d; --ma20: #9b59b6; --ma60: var(--gold); --ma120: #22d3ee;
    --green: var(--green); --red: var(--red); --gold: var(--gold); --blue: var(--blue);
    --radius: 10px; --shadow: var(--shadow);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.6; }
  .page { max-width: 1100px; margin: 0 auto; padding: 28px 32px; }

  .section-title { font-size: 16px; font-weight: 700; color: var(--accent2); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .card-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; font-weight: 600; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .ma-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ma-row:last-child { border-bottom: none; }
  .ma-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .ma-name { display: flex; align-items: center; font-size: 13px; color: var(--text2); }
  .ma-val { font-size: 13px; font-weight: 600; }
  .ma-status { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
  .status-above { background: rgba(46,204,113,0.15); color: var(--green); }
  .status-below { background: rgba(231,76,60,0.15); color: var(--red); }

  .zone-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .zone-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg3); border-radius: 6px; }
  .zone-label { font-size: 12px; color: var(--text2); }
  .zone-val { font-size: 13px; font-weight: 700; color: var(--text); }
  .zone-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .tag-support { background: rgba(46,204,113,0.15); color: var(--green); }
  .tag-resist { background: rgba(231,76,60,0.15); color: var(--red); }
  .tag-current { background: rgba(240,192,64,0.15); color: var(--gold); }

  .range-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
  .range-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text3); font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: all .15s; }
  .range-btn:hover { color: var(--text); border-color: var(--text2); }
  .range-btn.active { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent2); border-color: var(--accent); }
  .ma-toggle-btn { background: var(--bg3); border: 1px solid; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; opacity: 1; transition: opacity .15s; }
  .ma-toggle-btn.ma-off { opacity: 0.35; }
  .price-chart-container { margin-bottom: 16px; }

  /* ── SCORECARD (신규) ── */
  .risk-flag { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: rgba(231,76,60,0.15); color: var(--red); }
  .opportunity-badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: rgba(52,152,219,0.18); color: var(--blue); }
  .opportunity-badge .sub { font-weight: 500; opacity: 0.85; }

  @media (max-width: 640px) {
    .page { padding: 20px 16px; }
    .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
  }

/* ══════ #fund ══════ */
  :root {
    --bg: var(--bg); --bg2: var(--bg2); --bg3: var(--bg3); --border: var(--border);
    --text: var(--text); --text2: var(--text2); --text3: var(--text3);
    
    --green: var(--green); --red: var(--red); --gold: var(--gold); --blue: var(--blue);
    --radius: 10px; --shadow: var(--shadow);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.6; }
  .page { max-width: 1100px; margin: 0 auto; padding: 28px 32px; }

  .section-title { font-size: 16px; font-weight: 700; color: var(--accent2); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
  .card-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; font-weight: 600; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .chart-wrap { position: relative; }
  .chart-wrap canvas { max-width: 100%; }

  /* STAT BOX */
  .stat-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--text); margin: 4px 0 2px; }
  .stat-sub { font-size: 11px; color: var(--text3); }
  .stat-value.gold { color: var(--accent2); }

  .yoy-footnote { font-size: 11px; color: var(--text3); margin-top: 10px; }
  .yoy-footnote a { color: var(--accent2); text-decoration: none; }

  .section-label { font-size: 13px; color: var(--text); font-weight: 700; margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
  .section-label .dot { width:6px; height:6px; border-radius:50%; background:var(--accent2); }
  .diag-summary { display:flex; align-items:center; gap:12px; background: linear-gradient(90deg, rgba(46,204,113,0.14), rgba(46,204,113,0.03)); border:1px solid rgba(46,204,113,0.3); border-radius:8px; padding:12px 16px; margin-bottom:14px; }
  .diag-summary .icon { font-size:24px; }
  .diag-summary .title { font-size:14px; font-weight:800; color:var(--green); }
  .diag-summary .sub { font-size:12px; color:var(--text2); margin-top:2px; line-height:1.4; }
  .diag-summary.watch { background: linear-gradient(90deg, rgba(240,192,64,0.14), rgba(240,192,64,0.03)); border-color: rgba(240,192,64,0.35); }
  .diag-summary.watch .title { color: var(--gold); }
  .diag-summary.alert { background: linear-gradient(90deg, rgba(231,76,60,0.14), rgba(231,76,60,0.03)); border-color: rgba(231,76,60,0.35); }
  .diag-summary.alert .title { color: var(--red); }
  .diag-summary.none { background: var(--bg3); border-color: var(--border); }
  .diag-summary.none .title { color: var(--text2); }
  .diag-list { display:flex; flex-direction:column; gap:6px; margin-bottom: 22px; }
  .diag-row { display:flex; align-items:center; justify-content:space-between; background:var(--bg3); border-radius:8px; padding:10px 14px; }
  .diag-left { display:flex; align-items:baseline; gap:10px; }
  .diag-label { font-size:13px; color:var(--text); font-weight:600; min-width:96px; }
  .diag-value { font-size:15px; font-weight:700; color:var(--text); }
  .diag-note { font-size:11.5px; color:var(--text2); }
  .diag-badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .diag-badge.safe { background:rgba(46,204,113,0.16); color:var(--green); }
  .diag-badge.info { background:rgba(154,160,184,0.14); color:var(--text2); }
  .diag-badge.watch { background:rgba(240,192,64,0.16); color:var(--gold); }
  .diag-badge.alert { background:rgba(231,76,60,0.16); color:var(--red); }
  .score-comp { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
  .sc-total { display:flex; align-items:baseline; gap:6px; min-width:150px; }
  .sc-total-l { font-size:12px; color:var(--text2); }
  .sc-total-v { font-size:26px; font-weight:800; color:var(--text); }
  /* 그룹 안의 칸은 한 줄로 둔다. 폭이 모자라면 칸이 접히지 않고 그룹이 통째로 다음 줄로 간다(2026-09-24).
     flex-basis 0이라 넓은 화면에서는 두 그룹 폭이 같다(auto로 두면 칸 5개 쪽이 더 넓어진다). */
  .sc-group { display:flex; flex-direction:column; align-items:center; gap:6px; flex:1 1 0; min-width:max-content; background:var(--bg3); border-radius:8px; padding:10px 14px; }
  .sc-group-l { font-size:11px; color:var(--text3); text-align:center; }
  .sc-group-l [data-axis-pts] { color:var(--text); font-weight:700; }
  .sc-tiles { display:flex; gap:8px; flex-wrap:nowrap; justify-content:center; }
  @media (max-width: 520px) {
    .sc-group { min-width:0; width:100%; padding:10px 8px; }
    .sc-tiles { gap:4px; }
    .sc-item { min-width:0; }
    #fundComp .sc-tile { width:44px; }
    .sc-name { font-size:9px; }
  }
  .sc-item { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:52px; }
  .sc-tile { width:52px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:800; background:rgba(46,204,113,0.16); color:var(--green); }
  .sc-tile.lost { background:rgba(240,192,64,0.18); color:var(--gold); }
  .sc-tile.none { background:var(--bg3); color:var(--text3); }
  .sc-name { font-size:10px; color:var(--text2); white-space:nowrap; }
  .sc-tile.low { background:rgba(231,76,60,0.16); color:var(--red); }
  .vs-head { display:flex; align-items:baseline; gap:10px; margin-bottom:12px; }
  .vs-head-l { font-size:12px; color:var(--text3); }
  .vs-verdict { font-size:20px; font-weight:800; color:var(--gold); }
  .vs-asof { margin-left:auto; font-size:11px; color:var(--text3); }
  .vs-table-wrap { overflow-x:auto; }
  .vs-table { display:grid; grid-template-columns:150px 64px repeat(5, 44px) minmax(0, 1fr); column-gap:8px; row-gap:8px; align-items:center; background:var(--bg3); border-radius:8px; padding:12px 14px; min-width:560px; }
  .vc-head { font-size:9.5px; color:var(--text3); text-align:center; white-space:nowrap; }
  .vs-name { font-size:12px; color:var(--text2); cursor:help; white-space:nowrap; }
  .vs-val { font-size:17px; font-weight:800; color:var(--text); }
  .vs-note { grid-column:span 5; font-size:11.5px; color:var(--text2); }
  .vs-note strong { color:var(--text); }
  .vs-table .sc-tile { width:44px; height:20px; border-radius:4px; font-size:11.5px; }
  .vs-pill { justify-self:end; font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; white-space:nowrap; color:var(--green); background:rgba(46,204,113,0.14); }

  .vs-pill.high { color:var(--red); background:rgba(231,76,60,0.14); }

  .vs-pill-wrap .vs-pill { justify-self:auto; }
  .vs-hard { font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; white-space:nowrap; color:var(--gold); background:rgba(240,192,64,0.12); border:1px dashed rgba(240,192,64,0.55); cursor:help; }
  .vs-premise { font-size:12px; color:var(--text2); line-height:1.6; margin:12px 0 10px; }
  .vs-premise strong { color:var(--text); }

  .detail-toggle { cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; user-select: none; font-size: 12.5px; color: var(--text2); font-weight: 600; padding: 10px 2px 6px; border-top: 1px dashed var(--bg3); margin-top: 2px; }
  .detail-toggle:hover { color: var(--text); }
  .detail-toggle .toggle-hint { display: flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 999px; padding: 5px 11px; flex-shrink: 0; transition: background 0.2s ease, border-color 0.2s ease; }
  .detail-toggle:hover .toggle-hint { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .detail-toggle .toggle-hint-text { font-size: 10.5px; font-weight: 700; color: var(--accent2); white-space: nowrap; }
  .detail-toggle .chevron { font-size: 11px; color: var(--accent2); transition: transform 0.25s ease; flex-shrink: 0; }
  .detail-toggle.collapsed .chevron { transform: rotate(-90deg); }

  .diag-summary.watch + .detail-toggle .toggle-hint-text, .diag-summary.watch + .detail-toggle .chevron { color: var(--gold); }
  .diag-summary.alert + .detail-toggle .toggle-hint { background: rgba(231,76,60,0.12); border-color: rgba(231,76,60,0.35); }
  .diag-summary.alert + .detail-toggle:hover .toggle-hint { background: rgba(231,76,60,0.22); border-color: rgba(231,76,60,0.5); }
  .diag-summary.alert + .detail-toggle .toggle-hint-text, .diag-summary.alert + .detail-toggle .chevron { color: var(--red); }

  .diag-summary.none + .detail-toggle .toggle-hint-text, .diag-summary.none + .detail-toggle .chevron { color: var(--text2); }
  .collapsible-body { overflow: hidden; opacity: 1; transition: max-height 0.3s ease, opacity 0.2s ease, margin-top 0.2s ease; }
  .collapsible-body.collapsed { max-height: 0 !important; opacity: 0; margin-top: 0 !important; }

  .ccc-explain { font-size: 11.5px; color: var(--text2); line-height: 1.6; margin-bottom: 22px; }

  .tl-bar { height: 18px; border-radius: 5px; overflow: hidden; display: flex; }
  .tl-seg-float { background: repeating-linear-gradient(45deg, rgba(240,192,64,0.28) 0 6px, rgba(240,192,64,0.14) 6px 12px); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--gold); }

<script>
(function(){   // 라이브 홈(theme.js)과 같은 규칙·같은 저장 키 — 홈에서 고른 모드가 카드에도 이어진다
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null, choice = null;
  try { choice = localStorage.getItem('site-theme'); } catch (e) {}
  if (choice !== 'light' && choice !== 'dark') choice = null;
  function apply(){
    var dark = choice ? choice === 'dark' : !!(mq && mq.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var t = document.getElementById('theme-toggle');
    if (t) { t.setAttribute('aria-checked', String(dark)); t.title = dark ? '라이트 모드로 전환' : '다크 모드로 전환'; }
  }
  apply();
  if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  window.addEventListener('storage', function(e){ if (e.key === 'site-theme' || e.key === null) { choice = (e.newValue === 'light' || e.newValue === 'dark') ? e.newValue : null; apply(); } });
  document.addEventListener('DOMContentLoaded', function(){
    var t = document.getElementById('theme-toggle'); if (!t) return;
    t.onclick = function(){ choice = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';

    apply();
  });
})();
